<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Miku</title>

<style>
* { box-sizing: border-box; }
body {
    margin: 0; width: 100vw; height: 100vh; overflow: hidden;
    background: #000; font-family: Georgia, serif;
}
.scene {
    position: relative; width: 100%; height: 100%; overflow: hidden;
    background: linear-gradient(#ff7896, #ff9daf);
}
.heart {
    position: absolute; color: white; font-size: 18px; opacity: .7;
    animation: fall linear infinite;
}
@keyframes fall {
    from { transform: translateY(-50px); }
    to { transform: translateY(110vh); }
}
.cake {
    position: absolute; width: 190px; height: 170px;
    left: 50%; top: 56%; transform: translate(-50%, -50%);
}
.layer1 {
    position: absolute; bottom: 0; left: 10px; width: 170px; height: 48px;
    background: #8b523e; border-radius: 7px; box-shadow: 0 6px 0 #66382d;
    transform: scaleY(0); transform-origin: bottom;
    animation: buildLayer 0.8s ease forwards; animation-delay: 0.5s;
}
.layer2 {
    position: absolute; bottom: 45px; left: 20px; width: 150px; height: 43px;
    background: #c77b5b; border-radius: 7px; box-shadow: 0 5px 0 #92533f;
    transform: scaleY(0); transform-origin: bottom;
    animation: buildLayer 0.8s ease forwards; animation-delay: 1.4s;
}
.layer3 {
    position: absolute; bottom: 85px; left: 30px; width: 130px; height: 40px;
    background: #fffaf0; border-radius: 10px 10px 7px 7px; box-shadow: 0 5px 0 #e7d8c8;
    transform: scaleY(0); transform-origin: bottom;
    animation: buildLayer 0.8s ease forwards; animation-delay: 2.3s;
}
.cream {
    position: absolute; bottom: 72px; left: 38px; width: 114px; height: 25px;
    background: #fffaf0; border-radius: 50%; opacity: 0;
    animation: creamAppear .6s ease forwards; animation-delay: 3.05s;
}
.cream::after {
    content: ""; position: absolute; left: 8px; top: 10px; width: 20px; height: 20px;
    background: #fffaf0; border-radius: 0 0 15px 15px;
    box-shadow: 25px 0 #fffaf0, 50px 0 #fffaf0, 75px 0 #fffaf0;
}
@keyframes buildLayer {
    0% { transform: scaleY(0); }
    70% { transform: scaleY(1.08); }
    100% { transform: scaleY(1); }
}
@keyframes creamAppear {
    from { opacity: 0; transform: translateY(-15px); }
    to { opacity: 1; transform: translateY(0); }
}
.candle {
    position: absolute; left: 50%; bottom: 105px; width: 15px; height: 55px;
    background: repeating-linear-gradient(-45deg, #ffffff 0px, #ffffff 7px, #f5a6ba 7px, #f5a6ba 11px);
    border-radius: 8px; transform: translate(-50%, -75px); opacity: 0;
    animation: candleDown 1.5s cubic-bezier(.2,.8,.3,1) forwards; animation-delay: 3.5s;
}
@keyframes candleDown {
    0% { opacity: 0; transform: translate(-50%, -75px); }
    30% { opacity: 1; }
    100% { opacity: 1; transform: translate(-50%, 0); }
}
.flame {
    position: absolute; width: 17px; height: 25px; left: 50%; top: -23px;
    transform: translateX(-50%); background: #ffd447;
    border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%; opacity: 0;
    animation: flameAppear .5s ease forwards 5s, flameMove .45s ease-in-out infinite alternate 5.5s;
}
@keyframes flameAppear {
    from { opacity: 0; transform: translateX(-50%) scale(0); }
    to { opacity: 1; transform: translateX(-50%) scale(1); }
}
@keyframes flameMove {
    from { transform: translateX(-50%) scale(.9); }
    to { transform: translateX(-50%) scale(1.1); }
}
.plane {
    position: absolute; top: 24%; left: -220px; z-index: 20; font-size: 65px;
    animation: flyPlane 12s linear forwards; white-space: nowrap;
}
@keyframes flyPlane {
    0% { left: -220px; transform: rotate(-4deg); }
    25% { left: 15%; transform: rotate(2deg); }
    50% { left: 42%; transform: rotate(-1deg); }
    75% { left: 70%; transform: rotate(2deg); }
    100% { left: calc(100% + 250px); transform: rotate(-3deg); }
}
.banner {
    position: absolute; left: 60px; top: 28px; min-width: 250px; padding: 10px 20px;
    background: white; color: #e65378; font-size: 20px; font-weight: bold;
    text-align: center; border-radius: 5px; box-shadow: 0 4px 8px rgba(0,0,0,.15); white-space: nowrap;
}
.banner::before {
    content: ""; position: absolute; left: -18px; top: 0;
    border-top: 21px solid transparent; border-bottom: 21px solid transparent; border-right: 18px solid white;
}
.banner::after {
    content: ""; position: absolute; right: -18px; top: 0;
    border-top: 21px solid transparent; border-bottom: 21px solid transparent; border-left: 18px solid white;
}
.message {
    position: absolute; width: 100%; top: 75%; text-align: center;
    font-size: 28px; font-weight: bold; font-style: italic; color: #713f4c;
    opacity: 0; animation: messageAppear 1s ease forwards 5.2s;
}
.message span { color: #ff2f75; }
@keyframes messageAppear {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}
.music-btn {
    position: fixed; top: 20px; right: 20px; z-index: 999;
    padding: 10px 18px; background: #ffffff; color: #e65378;
    border: none; border-radius: 20px; cursor: pointer; font-weight: bold;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: 0.3s;
}
.music-btn:hover { background: #ff2f75; color: white; }
</style>
</head>

<body>
<audio id="bg-audio" loop>
    <source src="music.mp3" type="audio/mp3">
</audio>

<button class="music-btn" onclick="document.getElementById('bg-audio').play()">تشغيل الموسيقى 🎵</button>

<div class="scene">
    <span class="heart" style="left:5%; animation-duration:6s;">♥</span>
    <span class="heart" style="left:15%; animation-duration:8s;">♥</span>
    <span class="heart" style="left:27%; animation-duration:5s;">♥</span>
    <span class="heart" style="left:40%; animation-duration:7s;">♥</span>
    <span class="heart" style="left:53%; animation-duration:6s;">♥</span>
    <span class="heart" style="left:67%; animation-duration:9s;">♥</span>
    <span class="heart" style="left:80%; animation-duration:6s;">♥</span>
    <span class="heart" style="left:92%; animation-duration:8s;">♥</span>

    <div class="plane">
        ✈️
        <div class="banner">Happy Birthday Miku 💗</div>
    </div>

    <div class="cake">
        <div class="layer1"></div>
        <div class="layer2"></div>
        <div class="layer3"></div>
        <div class="cream"></div>
        <div class="candle">
            <div class="flame"></div>
        </div>
    </div>

    <div class="message">
        Happy Birthday Miku <span>♥</span>
    </div>
</div>
</body>
</html>
